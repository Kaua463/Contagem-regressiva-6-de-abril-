<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Contagem Regressiva</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 50px;
      background-color: #f0f0f0;
    }
    .contador {
      font-size: 2em;
      color: #333;
    }
  </style>
</head>
<body>

  <h1>Contagem Regressiva para 1º de Junho às 12:00</h1>
  <div class="contador" id="contador"></div>

  <script>
    function atualizarContador() {
      const destino = new Date("June 1, 2025 12:00:00").getTime();
      const agora = new Date().getTime();
      const diferenca = destino - agora;

      if (diferenca <= 0) {
        document.getElementById("contador").innerHTML = "O momento chegou!";
        clearInterval(intervalo);
        return;
      }

      const dias = Math.floor(diferenca / (1000 * 60 * 60 * 24));
      const horas = Math.floor((diferenca % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutos = Math.floor((diferenca % (1000 * 60 * 60)) / (1000 * 60));
      const segundos = Math.floor((diferenca % (1000 * 60)) / 1000);

      document.getElementById("contador").innerHTML =
        `${dias}d ${horas}h ${minutos}min ${segundos}s`;
    }

    const intervalo = setInterval(atualizarContador, 1000);
    atualizarContador(); // Chama imediatamente ao carregar
  </script>

</body>
</html>
